services:
  creeper-bot:
    build:
      context: .
      dockerfile: Dockerfile
    pid: host
    init: true
    restart: unless-stopped
    # Persist sprite data baselines, downloaded artwork, rendered PNGs, and
    # telemetry across redeploys.
    volumes:
      - creeper-bot-cache:/app/.cache
      - creeper-bot-telemetry:/app/.telemetry
      # Keep a second copy outside the container layer. Set the host-side path
      # through FORTNITE_SPRITE_ARCHIVE_BACKUP_HOST_DIR in Coolify/Compose.
      - ${FORTNITE_SPRITE_ARCHIVE_BACKUP_HOST_DIR:-/var/lib/creeper-bot/fortnite-sprite-archives}:/app/.backup/fortnite-sprites
    environment:
      FORTNITE_SPRITE_TELEMETRY_DIR: /app/.telemetry/fortnite-sprites
      FORTNITE_SPRITE_ARCHIVE_BACKUP_DIR: /app/.backup/fortnite-sprites
      FORTNITE_SPRITE_ARCHIVE_BACKUP_REQUIRED: "${FORTNITE_SPRITE_ARCHIVE_BACKUP_REQUIRED:-true}"
    expose:
      - "3001"
    # Coolify writes all runtime-enabled application variables to this file
    # before starting the Compose stack. The file is optional locally so the
    # Compose definition remains inspectable without copying production secrets.
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || 3001) + '/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s

volumes:
  creeper-bot-cache:
  creeper-bot-telemetry:
