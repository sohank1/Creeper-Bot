name: Fetch Map Data

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at 12:00 AM UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  fetch-map-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run fetch map data script
        env:
          FORTNITE_MAP_API_KEY: ${{ secrets.FORTNITE_MAP_API_KEY }}
        run: npx ts-node src/scripts/fetchMapData.ts

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Fortnite/FortniteMap/mapHistory.json
          git add src/Fortnite/FortniteMap/mapData.json
          
          # Only commit and push if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "Automated update: Fetch latest Fortnite map data"
            git push
          else
            echo "No changes detected."
          fi
